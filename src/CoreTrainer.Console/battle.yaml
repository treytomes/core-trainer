# Battle roster: the warriors loaded into the simulation, in order.
# Override this file at runtime with: --battle <path>
#
# Each entry has a Kind discriminator selecting which fields apply:
#   Kind: Archetype  -> a built-in program; set Archetype (Dwarf or Imp)
#   Kind: Nand       -> a trained NAND warrior; set GenomeFile (path to a .nand genome,
#                       relative to the executable). Train one with: --train
# Name is an optional display label for any kind.
#
# Standard and NAND warriors can be mixed freely in the same battle.
Battle:
  Warriors:
    - Kind: Archetype
      Archetype: Dwarf
      Name: Dwarf Alpha
    - Kind: Archetype
      Archetype: Imp
      Name: Imp Alpha
    - Kind: Archetype
      Archetype: Dwarf
      Name: Dwarf Beta
    - Kind: Archetype
      Archetype: Imp
      Name: Imp Beta
