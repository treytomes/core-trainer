# Training and model hyperparameters for the from-scratch Mini-GPT. The corpus (sentences to
# memorize) lives in corpus.txt, one sentence per line.
Training:
  # Model shape.
  BlockSize: 64 # max context length (positions)
  EmbedDim: 64 # embedding / model dimension
  Heads: 4 # attention heads per block (must divide EmbedDim)
  Layers: 2 # stacked transformer blocks
  # Optimization.
  Epochs: 2000
  # LearningRate: 0.003
  LearningRate: 0.0005
  Seed: 1
  # Logging / measurement cadence.
  LogEvery: 100 # epochs between loss log lines
  InferenceReps: 20 # repeats of the full generation pass for a stable timing measurement
  # Quantization: true = BitNet-b1.58 ternary {-1,0,+1} block weights, false = full-precision Linear.
  UseBitLinear: true
  # Parallelize the attention head loops when a head's work (~2·time²·headDim scalar ops) reaches this
  # threshold. Below it the loop stays serial (thread overhead dominates for few/small heads). Lower to
  # parallelize more eagerly as the model grows; set very high (e.g. 9999999999) to force serial.
  # At the current tiny size (time≈40, headDim=16) per-head work is ~50k, so 20000 engages the parallel
  # path here; raise back toward 200000+ if the fixed thread overhead ends up costing more than it saves.
  ParallelHeadThreshold: 20000

# Serilog configuration for the from-scratch Mini-GPT example. Mirrors the format used by the
# TorchSharp MiniGpt example so their logs are directly comparable.
Serilog:
  MinimumLevel:
    Default: Information
    Override:
      Microsoft: Warning
      System: Warning
  # Only the console sink is configured here. The file sink is added in code (Program.cs,
  # CreateLoggerFactory) with a per-run timestamped filename — one log file per run — so runs no
  # longer stack into a single day-rolling file.
  WriteTo:
    - Name: Console
      Args:
        outputTemplate: "[{Timestamp:HH:mm:ss} {Level:u3}] {Message:lj}{NewLine}{Exception}"
